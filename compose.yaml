services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: castleops
      POSTGRES_USER: castleops
      POSTGRES_PASSWORD: ${CASTLEOPS_DB_PASSWORD:?Set CASTLEOPS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castleops -d castleops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: