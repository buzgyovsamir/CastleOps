services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: castleops
      POSTGRES_USER: castleops
      POSTGRES_PASSWORD: ${CASTLEOPS_DB_PASSWORD:?Set CASTLEOPS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castleops -d castleops"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./castleops-backend
    environment:
      CASTLEOPS_DB_URL: jdbc:postgresql://postgres:5432/castleops
      CASTLEOPS_DB_USERNAME: castleops
      CASTLEOPS_DB_PASSWORD: ${CASTLEOPS_DB_PASSWORD:?Set CASTLEOPS_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./castleops-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"

volumes:
  postgres-data: